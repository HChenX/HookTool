plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace = 'com.hchen.appjava'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        minSdk 30
        aarMetadata {
            minCompileSdk = 30
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    buildFeatures {
        buildConfig = false
    }
}

dependencies {
    implementation project(':hooktool-reflect')
    implementation project(':hooktool-shell')
    implementation project(':hooktool-utils')
}