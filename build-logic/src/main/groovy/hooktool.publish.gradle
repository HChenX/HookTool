import org.gradle.api.publish.maven.tasks.GenerateMavenPom

plugins {
    id 'maven-publish'
}

group = 'com.github.HChenX.HookTool'
version = rootProject.ext.hooktoolVersion

// AGP 内置的 Kotlin 支持会向所有 Android 模块的 POM 注入 kotlin-stdlib
// 纯 Java 产物不应声明 Kotlin 运行时依赖，因此生成 POM 后统一移除
// AGP 在 withXml 动作之后才写入依赖，故不使用 MavenPom.withXml
def kotlinModule = project.name.endsWith('-kt')

if (!kotlinModule) {
    tasks.withType(GenerateMavenPom).configureEach { task ->
        task.doLast {
            def pomFile = task.destination
            if (!pomFile.exists()) return
            def original = pomFile.getText('UTF-8')
            def cleaned = original.replaceAll(
                /(?s)\s*<dependency>\s*<groupId>org\.jetbrains\.kotlin<\/groupId>.*?<\/dependency>/,
                '')
            if (cleaned != original) {
                pomFile.setText(cleaned, 'UTF-8')
            }
        }
    }

    // 校验 POM 中不含 Kotlin 依赖
    def pomFileProvider = layout.buildDirectory.file('publications/release/pom-default.xml')
    def verifyPom = tasks.register('verifyPomHasNoKotlin') {
        group = 'verification'
        description = '校验产物的 POM 中不存在 Kotlin 依赖。'
        dependsOn 'generatePomFileForReleasePublication'
        doLast {
            def pomFile = pomFileProvider.get().asFile
            if (!pomFile.exists()) {
                throw new GradleException("Missing generated POM for '${project.name}': " + pomFile)
            }
            if (pomFile.getText('UTF-8').contains('org.jetbrains.kotlin')) {
                throw new GradleException("Module '${project.name}' publishes a Kotlin dependency: " + pomFile)
            }
        }
    }
    tasks.named('check') { dependsOn verifyPom }
}
