pluginManagement {
    includeBuild("build-logic")
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
        maven { url = "https://api.xposed.info/" }
    }
}

rootProject.name = "HookTool"

// 4.0.0 组件库，详见 docs/modules.md
include ':hooktool-reflect'
include ':hooktool-common'
include ':hooktool-xposed'
include ':hooktool-res'
include ':hooktool-shell'
include ':hooktool-utils'
include ':hooktool-kt'
include ':hooktool-bom'

include ':app'

// 纯 Java 消费方，用于校验组件拆分结果。
include ':app-java'